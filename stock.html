<!DOCTYPE html>
<html lang="bn">
<head>
  <title>স্টক হিসাব</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body{font-family: 'SolaimanLipi', Arial; background:#f5f5f5; padding:10px;}
    .card{background:white; padding:15px; border-radius:10px; margin-bottom:10px;}
    input{width:100%; padding:10px; margin:5px 0; border:1px solid #ccc; border-radius:5px;}
    .btn{background:#667eea; color:white; border:none; padding:10px; width:100%; border-radius:5px; font-weight:bold;}
    .stock-item{display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #eee;}
    .qty-btn{background:#f0f0f0; border:none; width:30px; height:30px; border-radius:50%; font-size:18px;}
  </style>
</head>
<body>
  <h3>নতুন প্রোডাক্ট এড</h3>
  <div class="card">
    <input type="text" id="pName" placeholder="প্রোডাক্টের নাম">
    <input type="number" id="pQty" placeholder="পরিমাণ">
    <input type="number" id="pPrice" placeholder="ক্রয় মূল্য">
    <button class="btn" onclick="addStock()">প্রোডাক্ট এড করুন</button>
  </div>

  <h3>সকল প্রোডাক্ট</h3>
  <div class="card" id="stockList">লোড হচ্ছে...</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, query, where, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp({apiKey: "AIzaSyBdbroawwWdIX6CgQJFFv4Kk3oXAgnc_ak", authDomain: "smart-dokan-khata.firebaseapp.com", projectId: "smart-dokan-khata"});
  const auth = getAuth(app); const db = getFirestore(app);
  let userId = null; let stock = [];

  onAuthStateChanged(auth, (user) => {
    if (user) { userId = user.uid; loadStock(); } 
    else { window.location.href = "index.html"; }
  });

  window.addStock = async () => {
    const name = document.getElementById('pName').value;
    const qty = Number(document.getElementById('pQty').value);
    const price = Number(document.getElementById('pPrice').value);
    if(!name || !qty) return alert("নাম ও পরিমাণ দিন");
    await addDoc(collection(db, "stock"), {userId, name, qty, price, createdAt: new Date()});
    document.getElementById('pName').value = ""; document.getElementById('pQty').value = ""; document.getElementById('pPrice').value = "";
    loadStock();
  }

  window.updateStock = async (id, change) => {
    const s = stock.find(x => x.id === id);
    let newQty = s.qty + change;
    if(newQty < 0) return alert("স্টকে আর মাল নাই");
    await updateDoc(doc(db, "stock", id), {qty: newQty});
    loadStock();
  }

  async function loadStock() {
    const snap = await getDocs(query(collection(db, "stock"), where("userId", "==", userId)));
    stock = []; let html = "";
    snap.forEach(d => {
      const s = {id: d.id, ...d.data()}; stock.push(s);
      html += `
        <div class="stock-item">
          <div><b>${s.name}</b><br><small>${s.qty} পিস - ${s.price} টাকা</small></div>
          <div>
            <button class="qty-btn" onclick="updateStock('${s.id}', -1)">-</button>
            <button class="qty-btn" onclick="updateStock('${s.id}', 1)">+</button>
          </div>
        </div>
      `;
    });
    document.getElementById('stockList').innerHTML = html || "কোনো প্রোডাক্ট নাই";
  }
</script>
</body>
</html>
