<!DOCTYPE html>
<html lang="bn">
<head>
  <title>সেটিংস - Smart Dokan Khata</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *{box-sizing:border-box;} body{font-family: 'SolaimanLipi', Arial, sans-serif; background:#f5f5f5; margin:0; padding-bottom:70px;}
    .top-bar{background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; padding:12px 15px; display:flex; align-items:center; gap:10px; position:sticky; top:0;}
    .top-bar i{font-size:20px; cursor:pointer;} .top-bar h2{margin:0; font-size:16px;}
    .container{max-width:600px; margin:auto; padding:10px;}
    .setting-item{background:white; padding:14px 15px; display:flex; align-items:center; gap:12px; margin-bottom:8px; border-radius:8px; cursor:pointer;}
    .setting-item i{width:22px; font-size:18px; color:#667eea;}
    .setting-item span{flex:1; font-size:14px;}
    .toggle{width:45px; height:24px; background:#ccc; border-radius:20px; position:relative; cursor:pointer;}
    .toggle.active{background:#1dd1a1;} .toggle-dot{width:18px; height:18px; background:white; border-radius:50%; position:absolute; top:3px; left:3px; transition:0.2s;}
    .toggle.active .toggle-dot{left:24px;}
  </style>
</head>
<body>
  <div class="top-bar">
    <i class="fa-solid fa-arrow-left" onclick="window.location.href='menu.html'"></i>
    <h2>সেটিংস</h2>
  </div>
  
  <div class="container">
    <div class="setting-item" onclick="editShopInfo()">
      <i class="fa-solid fa-store"></i> <span>দোকানের তথ্য</span> <i class="fa-solid fa-angle-right"></i>
    </div>
    <div class="setting-item" onclick="changePassword()">
      <i class="fa-solid fa-lock"></i> <span>পাসওয়ার্ড পরিবর্তন</span> <i class="fa-solid fa-angle-right"></i>
    </div>
    <div class="setting-item">
      <i class="fa-solid fa-bell"></i> <span>তাগাদা নোটিফিকেশন</span>
      <div class="toggle active" id="notifyToggle" onclick="toggleNotify(this)"><div class="toggle-dot"></div></div>
    </div>
    <div class="setting-item" onclick="changeTheme()">
      <i class="fa-solid fa-moon"></i> <span>ডার্ক মোড</span> <i class="fa-solid fa-angle-right"></i>
    </div>
    <div class="setting-item" onclick="clearData()">
      <i class="fa-solid fa-trash" style="color:red;"></i> <span style="color:red;">সব ডাটা ডিলেট</span>
    </div>
    <div class="setting-item">
      <i class="fa-solid fa-circle-info"></i> <span>ভার্সন 1.0.0</span>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp({apiKey: "AIzaSyBdbroawwWdIX6CgQJFFv4Kk3oXAgnc_ak", authDomain: "smart-dokan-khata.firebaseapp.com", projectId: "smart-dokan-khata"});
  const auth = getAuth(app); const db = getFirestore(app);

  window.editShopInfo = () => alert("দোকানের নাম, ঠিকানা, নাম্বার এডিট করার পপআপ আসবে");
  window.changePassword = () => alert("Firebase থেকে পাসওয়ার্ড রিসেট লিংক Email এ যাবে");
  
  window.toggleNotify = (el) => {
    el.classList.toggle('active');
    const status = el.classList.contains('active') ? 'চালু' : 'বন্ধ';
    alert(`তাগাদা নোটিফিকেশন ${status} হলো`);
    localStorage.setItem("notify", status);
  }
  
  window.changeTheme = () => alert("ডার্ক মোড - খুব শীগ্রই আসছে");
  
  window.clearData = () => {
    if(confirm("আপনি কি সব কাস্টমার ও লেনদেন ডিলেট করতে চান? এই কাজ ফেরত হবে না")){
      localStorage.clear();
      alert("সব ডাটা ডিলেট হয়েছে");
    }
  }
</script>
</body>
</html>
