<!DOCTYPE html>
<html lang="bn">
<head>
  <title>সেটিংস - Smart Dokan Khata</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *{box-sizing:border-box;}
    body{font-family: 'SolaimanLipi', Arial, sans-serif; background:#f5f5f5; margin:0; padding:0; padding-bottom:70px; transition:0.3s;}
    body.dark{background:#1a1a1a; color:#eee;}
    body.dark .setting-item, body.dark .popup{background:#2a2a2a; color:#eee;}
    body.dark input{background:#333; color:#eee; border-color:#555;}

    .top-bar{background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; padding:12px 15px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100;}
    .top-bar i{font-size:20px; cursor:pointer;}
    .top-bar h2{margin:0; font-size:16px; flex:1;}
    
    .container{max-width:600px; margin:auto; padding:10px;}
    
    .setting-item{background:white; padding:14px 15px; display:flex; align-items:center; gap:12px; margin-bottom:8px; border-radius:8px; cursor:pointer; transition:0.2s;}
    .setting-item:active{background:#f0f0f0;}
    .setting-item i{width:22px; font-size:18px; color:#667eea; text-align:center;}
    .setting-item span{flex:1; font-size:14px;}
    .setting-item .fa-angle-right{color:#999; width:auto;}
    .danger{color:#ff4757!important;} .danger i{color:#ff4757!important;}
    
    .toggle{width:45px; height:24px; background:#ccc; border-radius:20px; position:relative; cursor:pointer;}
    .toggle.active{background:#1dd1a1;} 
    .toggle-dot{width:18px; height:18px; background:white; border-radius:50%; position:absolute; top:3px; left:3px; transition:0.2s;}
    .toggle.active .toggle-dot{left:24px;}

    /* Popup */
    .overlay{position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); display:none; z-index:200;}
    .overlay.show{display:block;}
    .popup{position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; border-radius:12px; padding:20px; width:90%; max-width:400px; z-index:201; display:none;}
    .popup.show{display:block;}
    .popup h3{margin:0 0 15px 0; font-size:16px;}
    .popup input{width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:5px; font-family:inherit;}
    .popup-btns{display:flex; gap:10px; margin-top:15px;}
    .popup-btn{flex:1; padding:10px; border:none; border-radius:5px; cursor:pointer; font-weight:bold;}
    .btn-save{background:#667eea; color:white;}
    .btn-cancel{background:#ddd; color:#333;}
  </style>
</head>
<body>
  <div class="top-bar">
    <i class="fa-solid fa-arrow-left" onclick="window.location.href='menu.html'"></i>
    <h2>সেটিংস</h2>
  </div>
  
  <div class="container">
    <div class="setting-item" onclick="openShopPopup()">
      <i class="fa-solid fa-store"></i> <span>দোকানের তথ্য</span> <i class="fa-solid fa-angle-right"></i>
    </div>
    <div class="setting-item" onclick="changePassword()">
      <i class="fa-solid fa-lock"></i> <span>পাসওয়ার্ড পরিবর্তন</span> <i class="fa-solid fa-angle-right"></i>
    </div>
    <div class="setting-item">
      <i class="fa-solid fa-bell"></i> <span>তাগাদা নোটিফিকেশন</span>
      <div class="toggle active" id="notifyToggle" onclick="toggleNotify(this)"><div class="toggle-dot"></div></div>
    </div>
    <div class="setting-item" onclick="toggleDark()">
      <i class="fa-solid fa-moon"></i> <span>ডার্ক মোড</span> <i class="fa-solid fa-angle-right"></i>
    </div>
    <div class="setting-item danger" onclick="clearData()">
      <i class="fa-solid fa-trash"></i> <span>সব ডাটা ডিলেট</span>
    </div>
    <div class="setting-item">
      <i class="fa-solid fa-circle-info"></i> <span>ভার্সন 1.0.0</span>
    </div>
  </div>

  <!-- দোকানের তথ্য Popup -->
  <div class="overlay" id="overlay" onclick="closeShopPopup()"></div>
  <div class="popup" id="shopPopup">
    <h3>দোকানের তথ্য</h3>
    <input type="text" id="shopNameInput" placeholder="দোকানের নাম">
    <input type="text" id="shopAddressInput" placeholder="দোকানের ঠিকানা">
    <input type="tel" id="shopPhoneInput" placeholder="দোকানের মোবাইল নাম্বার">
    <div class="popup-btns">
      <button class="popup-btn btn-cancel" onclick="closeShopPopup()">বাতিল</button>
      <button class="popup-btn btn-save" onclick="saveShopInfo()">সেভ করুন</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp({apiKey: "AIzaSyBdbroawwWdIX6CgQJFFv4Kk3oXAgnc_ak", authDomain: "smart-dokan-khata.firebaseapp.com", projectId: "smart-dokan-khata"});
  const auth = getAuth(app); const db = getFirestore(app);
  let userId = null;

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      userId = user.uid;
      loadShopInfo();
      loadSettings();
    } else {
      window.location.href = "index.html";
    }
  });

  // 1. দোকানের তথ্য লোড + Popup
  async function loadShopInfo() {
    const docRef = doc(db, "users", userId);
    const docSnap = await getDoc(docRef);
    if(docSnap.exists()){
      const data = docSnap.data();
      document.getElementById('shopNameInput').value = data.shopName || "";
      document.getElementById('shopAddressInput').value = data.shopAddress || "";
      document.getElementById('shopPhoneInput').value = data.shopPhone || "";
    }
  }
  window.openShopPopup = () => {
    document.getElementById('overlay').classList.add('show');
    document.getElementById('shopPopup').classList.add('show');
  }
  window.closeShopPopup = () => {
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('shopPopup').classList.remove('show');
  }
  window.saveShopInfo = async () => {
    const shopName = document.getElementById('shopNameInput').value.trim();
    const shopAddress = document.getElementById('shopAddressInput').value.trim();
    const shopPhone = document.getElementById('shopPhoneInput').value.trim();
    if(!shopName) return alert("দোকানের নাম দিন");
    
    await setDoc(doc(db, "users", userId), {shopName, shopAddress, shopPhone}, {merge: true});
    localStorage.setItem("shopName", shopName);
    alert("দোকানের তথ্য সেভ হয়েছে");
    closeShopPopup();
  }

  // 2. পাসওয়ার্ড পরিবর্তন - Firebase Email
  window.changePassword = async () => {
    const user = auth.currentUser;
    if(!user.email) return alert("আপনার অ্যাকাউন্টে Email নাই। তাই পাসওয়ার্ড রিসেট হবে না");
    
    try {
      await sendPasswordResetEmail(auth, user.email);
      alert(`${user.email} এ পাসওয়ার্ড রিসেট লিংক পাঠানো হয়েছে। Email চেক করুন`);
    } catch(error) {
      alert("Error: " + error.message);
    }
  }

  // 3. নোটিফিকেশন Toggle
  function loadSettings(){
    const notify = localStorage.getItem("notify") || "on";
    if(notify === "off") document.getElementById('notifyToggle').classList.remove('active');
    
    const dark = localStorage.getItem("darkMode") || "off";
    if(dark === "on") document.body.classList.add('dark');
  }
  window.toggleNotify = (el) => {
    el.classList.toggle('active');
    const status = el.classList.contains('active') ? 'on' : 'off';
    localStorage.setItem("notify", status);
    alert(`তাগাদা নোটিফিকেশন ${status === 'on' ? 'চালু' : 'বন্ধ'} হলো`);
  }

  // 4. ডার্ক মোড
  window.toggleDark = () => {
    document.body.classList.toggle('dark');
    const status = document.body.classList.contains('dark') ? 'on' : 'off';
    localStorage.setItem("darkMode", status);
  }

  // 5. সব ডাটা ডিলেট
  window.clearData = async () => {
    if(!confirm("আপনি কি সব কাস্টমার ও লেনদেন ডিলেট করতে চান? এই কাজ ফেরত হবে না")) return;
    
    const batch = writeBatch(db);
    const custSnap = await getDocs(query(collection(db, "customers"), where("userId", "==", userId)));
    const transSnap = await getDocs(query(collection(db, "transactions"), where("userId", "==", userId)));
    
    custSnap.forEach(d => batch.delete(doc(db, "customers", d.id)));
    transSnap.forEach(d => batch.delete(doc(db, "transactions", d.id)));
    
    await batch.commit();
    localStorage.clear();
    alert("সব ডাটা ডিলেট হয়েছে");
    window.location.href = "dashboard.html";
  }
</script>
</body>
</html>
