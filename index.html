<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>স্মার্ট বুক - দোকান খাতা</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root{ --primary:#FF6B35; --secondary:#004E64; --bg:#FFF8F0; --card:#FFFFFF; }
        body{font-family:'Hind Siliguri', Arial; background:var(--bg); padding:10px; max-width:650px; margin:auto; color:#333;}
    .header{background:linear-gradient(135deg, var(--primary), var(--secondary)); color:white; padding:20px; border-radius:15px; text-align:center; margin-bottom:15px;}
    .header h1{margin:0; font-size:28px; font-weight:700;}
    .card{background:var(--card); padding:15px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.08); margin-bottom:15px;}
        input, button{padding:12px; margin:6px 0; width:100%; border:1px solid #ddd; border-radius:8px; font-size:16px; box-sizing:border-box; font-family:inherit;}
        button{background:var(--primary); color:white; border:none; cursor:pointer; font-weight:600;}
    .btn-small{width:auto; padding:8px 12px; margin:3px; font-size:14px;}
    .btn-joma{background:#17a2b8;}.btn-baki{background:#6f42c1;}.btn-del{background:#dc3545;}
    .total{font-size:24px; font-weight:700; color:var(--secondary); text-align:center;}
    .customer-item{background:#f8f9fa; margin:8px 0; padding:12px; border-radius:10px; border-left:4px solid var(--primary);}
    .row{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;}
      #loginBox{display:block;} #otpBox{display:none;} #shopNameBox{display:none;} #mainApp{display:none;}
      #recaptcha-container{margin:10px 0;}
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- 1. মোবাইল নাম্বার বক্স -->
<div id="loginBox" class="card">
    <div class="header"><h1>📖 স্মার্ট বুক</h1><p>মোবাইল নাম্বার দিয়ে লগইন</p></div>
    <input type="tel" id="phoneNumber" placeholder="01XXXXXXXXX">
    <div id="recaptcha-container"></div>
    <button onclick="sendOTP()">OTP পাঠান</button>
</div>

<!-- 2. OTP বক্স -->
<div id="otpBox" class="card">
    <div class="header"><h1>📖 OTP ভেরিফাই</h1></div>
    <input type="number" id="otpCode" placeholder="6 ডিজিটের OTP">
    <button onclick="verifyOTP()">ভেরিফাই করুন</button>
</div>

<!-- 3. দোকানের নাম সেট বক্স - শুধু প্রথমবার -->
<div id="shopNameBox" class="card">
    <div class="header"><h1>📖 দোকানের নাম</h1></div>
    <input type="text" id="shopNameInput" placeholder="আপনার দোকানের নাম">
    <button onclick="saveShopName()">সেভ করুন</button>
</div>

<!-- 4. মেইন এপ -->
<div id="mainApp">
    <div class="header">
        <h1 id="currentShop">📖 দোকান</h1>
        <button onclick="logout()" style="background:gray; width:auto; padding:5px 10px; font-size:12px;">Logout</button>
    </div>
    <div class="card"><div class="total">মোট বাকি: <span id="totalDue">0</span> টাকা</div></div>
    <div class="card">
        <h3>➕ নতুন এন্ট্রি</h3>
        <input type="text" id="customerName" placeholder="গ্রাহকের নাম">
        <input type="tel" id="customerPhone" placeholder="মোবাইল নাম্বার">
        <input type="number" id="amount" placeholder="বাকির টাকা">
        <input type="number" id="paidAmount" placeholder="জমা টাকা" value="0">
        <button onclick="saveEntry()">সেভ করুন</button>
    </div>
    <div class="card">
        <input type="text" id="search" placeholder="🔍 নাম দিয়ে সার্চ" onkeyup="showList()">
        <div id="list">লোড হচ্ছে...</div>
    </div>
</div>

<script>
// 1. আপনার Firebase Config বসান
const firebaseConfig = { apiKey: "XXX", authDomain: "XXX", projectId: "XXX" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(); const db = firebase.firestore();

let confirmationResult; let currentUserId;

window.onload = function() {
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {'size': 'normal'});
    recaptchaVerifier.render();
    
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUserId = user.uid;
            checkShopName(user.uid);
        }
    });
}

function sendOTP(){
    let phone = "+88" + document.getElementById('phoneNumber').value;
    auth.signInWithPhoneNumber(phone, window.recaptchaVerifier).then(result => {
        confirmationResult = result;
        document.getElementById('loginBox').style.display='none';
        document.getElementById('otpBox').style.display='block';
    }).catch(error => alert("OTP পাঠানো যায়নি: " + error.message));
}

function verifyOTP(){
    let code = document.getElementById('otpCode').value;
    confirmationResult.confirm(code).then(result => {
        currentUserId = result.user.uid;
        checkShopName(currentUserId);
    }).catch(error => alert("ভুল OTP"));
}

function checkShopName(uid){
    db.collection("shops").doc(uid).get().then(doc => {
        if(doc.exists){
            document.getElementById('currentShop').innerText = "📖 " + doc.data().name;
            showMainApp();
        } else {
            document.getElementById('otpBox').style.display='none';
            document.getElementById('shopNameBox').style.display='block';
        }
    });
}

function saveShopName(){
    let name = document.getElementById('shopNameInput').value;
    if(!name) return;
    db.collection("shops").doc(currentUserId).set({name: name, phone: auth.currentUser.phoneNumber});
    document.getElementById('currentShop').innerText = "📖 " + name;
    showMainApp();
}

function showMainApp(){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('otpBox').style.display='none';
    document.getElementById('shopNameBox').style.display='none';
    document.getElementById('mainApp').style.display='block';
    loadData();
}

function logout(){ auth.signOut(); location.reload(); }

// বাকি সব ফাংশন আগের মতোই, শুধু currentUserId দিয়ে ডাটা সেভ হবে
function loadData(){
    db.collection("shops").doc(currentUserId).collection("customers").onSnapshot(snapshot => {
        let data=[]; snapshot.forEach(doc => data.push({id: doc.id,...doc.data()}));
        showList(data);
    });
}
function saveEntry(){
    let entry = {name: document.getElementById('customerName').value, phone: document.getElementById('customerPhone').value, taka: +document.getElementById('amount').value || 0, paid: +document.getElementById('paidAmount').value || 0};
    db.collection("shops").doc(currentUserId).collection("customers").add(entry);
}
function addJoma(id){ let pay=prompt("কত জমা?"); if(pay>0) db.collection("shops").doc(currentUserId).collection("customers").doc(id).update({paid: firebase.firestore.FieldValue.increment(+pay)}); }
function addBaki(id){ let baki=prompt("আর কত বাকি?"); if(baki>0) db.collection("shops").doc(currentUserId).collection("customers").doc(id).update({taka: firebase.firestore.FieldValue.increment(+baki)}); }
function deleteEntry(id){ if(confirm("ডিলিট?")) db.collection("shops").doc(currentUserId).collection("customers").doc(id).delete(); }
function showList(data){ /* আগের showList কোড */ }
</script>
</body>
</html>
