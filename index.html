<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>ঘরের বাজার - স্মার্ট খাতা</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root{ --primary:#FF6B35; --secondary:#004E64; --bg:#FFF8F0; --card:#FFFFFF; }
        body{font-family:'Hind Siliguri', Arial; background:var(--bg); padding:10px; max-width:650px; margin:auto; color:#333;}
      .header{background:linear-gradient(135deg, var(--primary), var(--secondary)); color:white; padding:20px; border-radius:15px; text-align:center; margin-bottom:15px;}
      .header h1{margin:0; font-size:28px; font-weight:700;}
      .card{background:var(--card); padding:15px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.08); margin-bottom:15px;}
        input, button, select{padding:12px; margin:6px 0; width:100%; border:1px solid #ddd; border-radius:8px; font-size:16px; box-sizing:border-box; font-family:inherit;}
        button{background:var(--primary); color:white; border:none; cursor:pointer; font-weight:600;}
        button:hover{opacity:0.9;}
      .btn-small{width:auto; padding:8px 12px; margin:3px; font-size:14px;}
      .btn-call{background:#28a745;}.btn-wa{background:#25D366;}.btn-del{background:#dc3545;}.btn-edit{background:#ffc107; color:black;}.btn-set{background:#004E64;}
      .total{font-size:24px; font-weight:700; color:var(--secondary); text-align:center;}
      .customer-item{background:#f8f9fa; margin:8px 0; padding:12px; border-radius:10px; border-left:4px solid var(--primary);}
      .row{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;}
      .hide{display:none;}
        #loginBox,#settingsBox{position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; z-index:999;}
      .login-card{background:white; padding:25px; border-radius:15px; width:90%; max-width:400px;}
      .tab-btn{width:48%; display:inline-block;}
    </style>
</head>
<body>

<!-- লগইন সিলেকশন -->
<div id="loginBox">
    <div class="login-card">
        <h2>🏪 ঘরের বাজার</h2>
        <button class="tab-btn" onclick="showAdminLogin()">এডমিন লগইন</button>
        <button class="tab-btn" style="background:#25D366;" onclick="showCustomerLogin()">গ্রাহক লগইন</button>

        <!-- এডমিন লগইন -->
        <div id="adminLogin" class="hide">
            <h3>🔒 এডমিন</h3>
            <input type="password" id="adminPass" placeholder="এডমিন পাসওয়ার্ড">
            <button onclick="adminLogin()">লগইন</button>
            <button onclick="resetPassword()" style="background:gray;">পাস রিসেট</button>
        </div>

        <!-- কাস্টমার লগইন -->
        <div id="customerLogin" class="hide">
            <h3>📱 গ্রাহক</h3>
            <input type="tel" id="customerLoginPhone" placeholder="আপনার মোবাইল নাম্বার দিন">
            <button onclick="customerLogin()" style="background:#25D366;">হিসাব দেখুন</button>
        </div>
    </div>
</div>

<!-- পাসওয়ার্ড সেটিংস -->
<div id="settingsBox" class="hide">
    <div class="login-card">
        <h2>⚙️ পাসওয়ার্ড পরিবর্তন</h2>
        <input type="password" id="oldPass" placeholder="পুরাতন পাসওয়ার্ড">
        <input type="password" id="newPass" placeholder="নতুন পাসওয়ার্ড">
        <input type="password" id="confirmPass" placeholder="কনফার্ম পাসওয়ার্ড">
        <button onclick="changePassword()">সেভ</button>
        <button onclick="closeSettings()" style="background:gray;">বাতিল</button>
    </div>
</div>

<!-- এডমিন প্যানেল -->
<div id="adminPanel" class="hide">
    <div class="header">
        <h1>🏪 ঘরের বাজার - এডমিন</h1>
        <button onclick="logout()" style="background:red; width:auto; padding:5px 10px;">লগআউট</button>
    </div>

    <div class="card">
        <div class="total">মোট বাকি: <span id="totalDue">0</span> টাকা</div>
        <div class="total" style="font-size:16px; color:var(--primary);">আজকের বাকি: <span id="todayDue">0</span> টাকা</div>
    </div>

    <div class="card">
        <h3 id="formTitle">➕ নতুন এন্ট্রি</h3>
        <input type="hidden" id="editId">
        <input type="text" id="customerName" placeholder="গ্রাহকের নাম">
        <input type="tel" id="customerPhone" placeholder="মোবাইল নাম্বার 01XXXXXXXXX">
        <input type="number" id="amount" placeholder="বাকির টাকা">
        <input type="number" id="paidAmount" placeholder="জমা/পরিশোধ টাকা" value="0">
        <input type="date" id="date">
        <button onclick="saveEntry()">সেভ করুন</button>
        <button onclick="cancelEdit()" id="cancelBtn" class="hide" style="background:gray;">বাতিল</button>
    </div>

    <div class="card">
        <input type="text" id="search" placeholder="🔍 নাম/নাম্বার দিয়ে সার্চ" onkeyup="showAdminList()">
        <button onclick="sendWhatsAppList()" style="background:#25D366;">📲 WhatsApp লিস্ট</button>
        <button class="btn-set" onclick="openSettings()">⚙️ পাস পরিবর্তন</button>
        <h3>সকল গ্রাহক</h3>
        <div id="adminList"></div>
    </div>
</div>

<!-- কাস্টমার প্যানেল -->
<div id="customerPanel" class="hide">
    <div class="header">
        <h1 id="customerHeader">গ্রাহকের হিসাব</h1>
        <button onclick="logout()" style="background:red; width:auto; padding:5px 10px;">লগআউট</button>
    </div>
    <div class="card">
        <h3>আপনার বর্তমান বাকি: <span id="customerDue" style="color:red;">0</span> টাকা</h3>
        <h3>মোট জমা: <span id="customerPaid" style="color:green;">0</span> টাকা</h3>
    </div>
    <div class="card">
        <h3>আপনার লেনদেন হিস্ট্রি</h3>
        <div id="customerHistory"></div>
    </div>
</div>

<script>
const SHOP_NAME = "ঘরের বাজার";
let ADMIN_PASSWORD = localStorage.getItem('adminPass') || "1234";
let data = JSON.parse(localStorage.getItem('ghorerbazar')) || [];
let currentCustomerPhone = "";
document.getElementById('date').valueAsDate = new Date();

// লগইন সিলেকশন
function showAdminLogin(){ document.getElementById('adminLogin').classList.remove('hide'); document.getElementById('customerLogin').classList.add('hide'); }
function showCustomerLogin(){ document.getElementById('customerLogin').classList.remove('hide'); document.getElementById('adminLogin').classList.add('hide'); }

// এডমিন লগইন
function adminLogin(){
    if(document.getElementById('adminPass').value === ADMIN_PASSWORD){
        document.getElementById('loginBox').classList.add('hide');
        document.getElementById('adminPanel').classList.remove('hide');
        showAdminList();
    } else { alert("ভুল এডমিন পাসওয়ার্ড"); }
}

// কাস্টমার লগইন
function customerLogin(){
    let phone = document.getElementById('customerLoginPhone').value;
    let customerData = data.filter(d => d.phone === phone);
    if(customerData.length > 0){
        currentCustomerPhone = phone;
        document.getElementById('loginBox').classList.add('hide');
        document.getElementById('customerPanel').classList.remove('hide');
        showCustomerData(phone);
    } else { alert("এই নাম্বারে কোন হিসাব পাওয়া যায়নি"); }
}

function logout(){ location.reload(); }

// পাসওয়ার্ড
function resetPassword(){ if(confirm("পাসওয়ার্ড 1234 হবে?")){ localStorage.removeItem('adminPass'); ADMIN_PASSWORD="1234"; alert("রিসেট হয়েছে"); } }
function openSettings(){ document.getElementById('settingsBox').classList.remove('hide'); }
function closeSettings(){ document.getElementById('settingsBox').classList.add('hide'); }
function changePassword(){
    let oldP=document.getElementById('oldPass').value; let newP=document.getElementById('newPass').value; let confP=document.getElementById('confirmPass').value;
    if(oldP!==ADMIN_PASSWORD){alert("পুরাতন পাস ভুল");return;} if(newP!==confP){alert("মিলছে না");return;}
    ADMIN_PASSWORD=newP; localStorage.setItem('adminPass',newP); alert("পাস পরিবর্তন হয়েছে"); closeSettings();
}

// এডমিন: এড/এডিট/ডিলেট
let editMode = false;
function saveEntry(){
    let id = document.getElementById('editId').value;
    let entry = {
        id: editMode? parseInt(id) : Date.now(),
        name: document.getElementById('customerName').value,
        phone: document.getElementById('customerPhone').value,
        taka: parseInt(document.getElementById('amount').value) || 0,
        paid: parseInt(document.getElementById('paidAmount').value) || 0,
        date: document.getElementById('date').value
    };
    if(editMode){
        let index = data.findIndex(d=>d.id==id); data[index]=entry;
    } else { data.push(entry); }
    saveData(); cancelEdit();
}

function editEntry(id){
    let d = data.find(d=>d.id==id);
    document.getElementById('editId').value = d.id;
    document.getElementById('customerName').value = d.name;
    document.getElementById('customerPhone').value = d.phone;
    document.getElementById('amount').value = d.taka;
    document.getElementById('paidAmount').value = d.paid;
    document.getElementById('date').value = d.date;
    document.getElementById('formTitle').innerText = "✏️ এন্ট্রি এডিট করুন";
    document.getElementById('cancelBtn').classList.remove('hide');
    editMode = true; window.scrollTo(0,0);
}

function cancelEdit(){
    editMode=false; document.getElementById('editId').value="";
    ['customerName','customerPhone','amount','paidAmount'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('paidAmount').value='0'; document.getElementById('formTitle').innerText="➕ নতুন এন্ট্রি";
    document.getElementById('cancelBtn').classList.add('hide');
}

function deleteEntry(id){ if(confirm("ডিলিট করবেন?")){ data = data.filter(d=>d.id!=id); saveData(); } }

function saveData(){ localStorage.setItem('ghorerbazar', JSON.stringify(data)); showAdminList(); }

// এডমিন লিস্ট দেখানো
function showAdminList(){
    let search = document.getElementById('search').value.toLowerCase();
    let list = document.getElementById('adminList'); let totalDue=0,todayDue=0;
    let today=new Date().toISOString().split('T')[0]; list.innerHTML='';
    data.filter(d => d.name.toLowerCase().includes(search) || d.phone.includes(search)).forEach(d=>{
        let baki=d.taka-d.paid; totalDue+=baki; if(d.date===today) todayDue+=baki;
        list.innerHTML+=`<div class="customer-item"><div class="row"><div><b>${d.name}</b><br><small>📞${d.phone}</small><br>বাকি:${d.taka}|জমা:${d.paid}|<b style="color:red;">বর্তমান:${baki}</b><br><small>${d.date}</small></div><div>
        ${d.phone?`<a href="tel:${d.phone}"><button class="btn-small btn-call">কল</button></a>`:''}
        ${d.phone?`<a href="https://wa.me/88${d.phone}" target="_blank"><button class="btn-small btn-wa">WA</button></a>`:''}
        <button class="btn-small btn-edit" onclick="editEntry(${d.id})">এডিট</button>
        <button class="btn-small btn-del" onclick="deleteEntry(${d.id})">ডিলেট</button></div></div></div>`;
    });
    document.getElementById('totalDue').innerText=totalDue; document.getElementById('todayDue').innerText=todayDue;
}

// কাস্টমার ডাটা দেখানো
function showCustomerData(phone){
    let customerData = data.filter(d=>d.phone===phone);
    let name = customerData[0]?.name || "গ্রাহক";
    document.getElementById('customerHeader').innerText = `${name} এর হিসাব`;
    let totalDue=0,totalPaid=0; let history="";
    customerData.forEach(d=>{
        let baki=d.taka-d.paid; totalDue+=baki; totalPaid+=d.paid;
        history+=`<div class="customer-item">তারিখ:${d.date}<br>বাকি:${d.taka} টাকা<br>জমা:${d.paid} টাকা<br><b>বর্তমান বাকি:${baki} টাকা</b></div>`;
    });
    document.getElementById('customerDue').innerText=totalDue;
    document.getElementById('customerPaid').innerText=totalPaid;
    document.getElementById('customerHistory').innerHTML=history;
}

// WhatsApp
function sendWhatsAppList(){
    let msg=`*${SHOP_NAME}*\n*বাকির হিসাব*\n----------------\n`;
    data.forEach(d=>{ let baki=d.taka-d.paid; if(baki>0) msg+=`*${d.name}* - ${baki} টাকা - ${d.phone}\n`; });
    msg+=`----------------\nমোট বাকি: ${document.getElementById('totalDue').innerText} টাকা`;
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}
</script>
</body>
</html>
