<!DOCTYPE html>
<html>
<head>
  <title>Smart Dokan Khata - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{font-family: Arial; display:flex; justify-content:center; align-items:center; height:100vh; background:#f2f2f2; margin:0;}
    .box{background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px #ccc; width:90%; max-width:350px; text-align:center;}
    h2{color:#4CAF50; margin-top:10px;}
    input{width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:5px; box-sizing:border-box; font-size:16px;}
    button{width:100%; padding:12px; background:#4CAF50; color:white; border:none; border-radius:5px; cursor:pointer; margin:5px 0; font-size:16px;}
    button:hover{background:#45a049;}
    #msg{color:red; margin-top:10px; font-size:14px;}
  </style>
</head>
<body>

<div class="box">
  <img src="logo.png" alt="Logo" style="width:120px; margin-bottom:10px;">
  <h2>Smart Dokan Khata</h2>
  <input type="email" id="email" placeholder="ইমেইল দিন">
  <input type="password" id="password" placeholder="পাসওয়ার্ড দিন">
  <button onclick="register()">নতুন একাউন্ট</button>
  <button onclick="login()">লগইন</button>
  <p id="msg"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBdbroawwWdIX6CgQJFFv4Kk3oXAgnc_ak",
    authDomain: "smart-dokan-khata.firebaseapp.com",
    projectId: "smart-dokan-khata",
    storageBucket: "smart-dokan-khata.firebasestorage.app",
    messagingSenderId: "941938264732",
    appId: "1:941938264732:web:6f1ddb88c0d8df480dfb59"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  function goToDashboard() {
    window.location.href = "dashboard.html";
  }

  window.register = () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    createUserWithEmailAndPassword(auth, email, password)
      .then(() => goToDashboard())
      .catch((error) => document.getElementById('msg').innerText = "Error: " + error.message);
  }

  window.login = () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    signInWithEmailAndPassword(auth, email, password)
      .then(() => goToDashboard())
      .catch((error) => document.getElementById('msg').innerText = "Error: " + error.message);
  }
</script>

</body>
</html>
