<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>স্মার্ট দোকান খাতা</title>
<style>
body{font-family:solaimanLipi,Arial;background:#f0f2f5;padding:15px}
.container{max-width:600px;margin:auto;background:white;padding:20px;border-radius:10px;box-shadow:0 0 10px #ccc}
h1{text-align:center;color:#2c3e50}
input,button,select{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:5px;font-size:16px}
button{background:#27ae60;color:white;border:none;cursor:pointer}
button:hover{background:#229954}
table{width:100%;margin-top:20px;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#3498db;color:white}
</style>
</head>
<body>
<div class="container">
<h1>📒 স্মার্ট দোকান খাতা</h1>

<h3>নতুন বিক্রি যোগ করুন</h3>
<input type="date" id="date">
<input type="text" id="item" placeholder="পণ্যের নাম">
<input type="number" id="price" placeholder="বিক্রি দাম টাকা">
<input type="number" id="cost" placeholder="ক্রয় দাম টাকা">
<button onclick="addSale()">সেভ করুন</button>

<h3>আজকের হিসাব</h3>
<table id="salesTable">
<tr><th>তারিখ</th><th>পণ্য</th><th>লাভ</th></tr>
</table>
<p><b>মোট লাভ: <span id="totalProfit">0</span> টাকা</b></p>

</div>
<script>
let sales = JSON.parse(localStorage.getItem('sales')) || [];
function addSale(){
  let sale = {
    date: document.getElementById('date').value,
    item: document.getElementById('item').value,
    profit: document.getElementById('price').value - document.getElementById('cost').value
  };
  sales.push(sale);
  localStorage.setItem('sales', JSON.stringify(sales));
  showSales();
}
function showSales(){
  let table = document.getElementById('salesTable');
  let total = 0;
  table.innerHTML = '<tr><th>তারিখ</th><th>পণ্য</th><th>লাভ</th></tr>';
  sales.forEach(s => {
    table.innerHTML += `<tr><td>${s.date}</td><td>${s.item}</td><td>${s.profit}</td></tr>`;
    total += parseInt(s.profit);
  });
  document.getElementById('totalProfit').innerText = total;
}
document.getElementById('date').valueAsDate = new Date();
showSales();
</script>
</body>
</html>
