<!DOCTYPE html>
<html>
<head>
  <title>Smart Dokan Khata - Login</title>
  <style>
    body{font-family: Arial; display:flex; justify-content:center; align-items:center; height:100vh; background:#f2f2f2;}
    .box{background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px #ccc; width:300px;}
    input{width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:5px;}
    button{width:100%; padding:10px; background:#4CAF50; color:white; border:none; border-radius:5px; cursor:pointer;}
    button:hover{background:#45a049;}
  </style>
</head>
<body>

<div class="box">
  <h2>Smart Dokan Khata</h2>
  <input type="email" id="email" placeholder="ইমেইল দিন">
  <input type="password" id="password" placeholder="পাসওয়ার্ড দিন">
  <button onclick="register()">নতুন একাউন্ট</button>
  <button onclick="login()">লগইন</button>
  <p id="msg"></p>
</div>

<script type="module">
  // 1. আপনার Config
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBdbroawwWdIX6CgQJFFv4Kk3oXAgnc_ak",
    authDomain: "smart-dokan-khata.firebaseapp.com",
    projectId: "smart-dokan-khata",
    storageBucket: "smart-dokan-khata.firebasestorage.app",
    messagingSenderId: "941938264732",
    appId: "1:941938264732:web:6f1ddb88c0d8df480dfb59"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // 2. রেজিস্টার ফাংশন
  window.register = () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    createUserWithEmailAndPassword(auth, email, password)
      .then(() => document.getElementById('msg').innerText = "একাউন্ট হয়ে গেছে!")
      .catch((error) => document.getElementById('msg').innerText = error.message);
  }

  // 3. লগইন ফাংশন
  window.login = () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    signInWithEmailAndPassword(auth, email, password)
      .then(() => document.getElementById('msg').innerText = "লগইন সফল!")
      .catch((error) => document.getElementById('msg').innerText = error.message);
  }
</script>

</body>
</html>
