<!DOCTYPE html>
<html>
<head>
  <title>Smart Dokan Khata</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{box-sizing:border-box;}
    body{font-family: 'SolaimanLipi', Arial; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin:0; padding:15px; min-height:100vh;}
    
    .container{max-width:600px; margin:auto;}
    
    .header{display:flex; align-items:center; background:white; padding:15px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,0.2); margin-bottom:20px;}
    .header img{width:50px; margin-right:10px;}
    .header h2{margin:0; color:#667eea; font-size:18px; flex:1;}
    .header button{background:#ff4757; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer;}
    
    .card{background:white; padding:20px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,0.15); margin-bottom:20px;}
    .card h3{margin-top:0; color:#333; border-bottom:2px solid #667eea; padding-bottom:10px;}
    
    input, select{width:100%; padding:12px; margin:8px 0; border:2px solid #ddd; border-radius:8px; font-size:16px;}
    input:focus{border-color:#667eea; outline:none;}
    
    .btn-group{display:flex; gap:10px;}
    .btn{flex:1; padding:12px; border:none; border-radius:8px; cursor:pointer; font-size:16px; font-weight:bold;}
    .btn-baki{background:#ff6b6b; color:white;}
    .btn-joma{background:#1dd1a1; color:white;}
    .btn-add{background:#667eea; color:white;}
    
    .summary{display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:center;}
    .summary-box{background:#f1f2f6; padding:15px; border-radius:10px;}
    .summary-box h4{margin:5px 0; color:#666; font-size:14px;}
    .summary-box p{margin:5px 0; font-size:22px; font-weight:bold; color:#667eea;}
    
    .customer-list .customer{display:flex; justify-content:space-between; align-items:center; background:#f1f2f6; padding:12px; border-radius:10px; margin:8px 0;}
    .customer-info b{color:#333;}
    .customer-info small{color:#666;}
    .customer-balance{font-weight:bold; font-size:18px;}
    .balance-due{color:#ff4757;}
    .balance-clear{color:#1dd1a1;}
  </style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <img src="logo.png" alt="Logo">
    <h2 id="shopName">আমার দোকান</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- দোকানের নাম -->
  <div class="card">
    <h3>দোকানের সেটিং</h3>
    <input type="text" id="shopNameInput" placeholder="আপনার দোকানের নাম লিখুন">
    <button class="btn btn-add" onclick="saveShopName()">নাম সেভ করুন</button>
  </div>

  <!-- নতুন কাস্টমার -->
  <div class="card">
    <h3>নতুন কাস্টমার এড</h3>
    <input type="text" id="custName" placeholder="কাস্টমারের নাম">
    <input type="tel" id="custPhone" placeholder="মোবাইল নাম্বার">
    <button class="btn btn-add" onclick="addCustomer()">কাস্টমার এড করুন</button>
  </div>

  <!-- লেনদেন -->
  <div class="card">
    <h3>নতুন লেনদেন</h3>
    <select id="custSelect"><option>কাস্টমার সিলেক্ট করুন</option></select>
    <input type="number" id="amount" placeholder="টাকার পরিমাণ">
    <div class="btn-group">
      <button class="btn btn-baki" onclick="addTransaction('baki')">বাকি +</button>
      <button class="btn btn-joma" onclick="addTransaction('joma')">জমা -</button>
    </div>
  </div>

  <!-- সারাংশ -->
  <div class="card">
    <h3>মোট হিসাব</h3>
    <div class="summary">
      <div class="summary-box">
        <h4>মোট বাকি</h4>
        <p id="totalBaki">0 টাকা</p>
      </div>
      <div class="summary-box">
        <h4>মোট জমা</h4>
        <p id="totalJoma">0 টাকা</p>
      </div>
    </div>
  </div>

  <!-- কাস্টমার লিস্ট -->
  <div class="card">
    <h3>সকল কাস্টমার</h3>
    <div id="customerList" class="customer-list">কোনো কাস্টমার নাই</div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, query, where, doc, setDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBdbroawwWdIX6CgQJFFv4Kk3oXAgnc_ak",
    authDomain: "smart-dokan-khata.firebaseapp.com",
    projectId: "smart-dokan-khata",
    storageBucket: "smart-dokan-khata.firebasestorage.app",
    messagingSenderId: "941938264732",
    appId: "1:941938264732:web:6f1ddb88c0d8df480dfb59"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let userId = null;
  let customers = [];

  onAuthStateChanged(auth, (user) => {
    if (user) {
      userId = user.uid;
      loadData();
    } else {
      window.location.href = "index.html";
    }
  });

  window.logout = () => signOut(auth);

  // দোকানের নাম সেভ
  window.saveShopName = async () => {
    const name = document.getElementById('shopNameInput').value;
    if(!name) return alert("দোকানের নাম লিখুন");
    await setDoc(doc(db, "shops", userId), {name: name});
    document.getElementById('shopName').innerText = name;
    alert("দোকানের নাম সেভ হয়েছে");
  }

  // কাস্টমার এড
  window.addCustomer = async () => {
    const name = document.getElementById('custName').value;
    const phone = document.getElementById('custPhone').value;
    if(!name || !phone) return alert("নাম ও নাম্বার দিন");
    await addDoc(collection(db, "customers"), {userId, name, phone, balance: 0});
    document.getElementById('custName').value = "";
    document.getElementById('custPhone').value = "";
    loadData();
  }

  // লেনদেন
  window.addTransaction = async (type) => {
    const custId = document.getElementById('custSelect').value;
    const amount = Number(document.getElementById('amount').value);
    if(custId === "কাস্টমার সিলেক্ট করুন" || !amount) return alert("কাস্টমার ও টাকা সিলেক্ট করুন");
    
    await addDoc(collection(db, "transactions"), {userId, custId, amount, type, date: new Date()});
    
    // ব্যালেন্স আপডেট
    const custRef = doc(db, "customers", custId);
    const custSnap = await getDoc(custRef);
    let newBalance = custSnap.data().balance;
    if(type === 'baki') newBalance += amount;
    else newBalance -= amount;
    await updateDoc(custRef, {balance: newBalance});
    
    document.getElementById('amount').value = "";
    loadData();
  }

  // সব ডাটা লোড
  async function loadData() {
    // দোকানের নাম
    const shopSnap = await getDoc(doc(db, "shops", userId));
    if(shopSnap.exists()) document.getElementById('shopName').innerText = shopSnap.data().name;

    // কাস্টমার লোড
    const custQuery = query(collection(db, "customers"), where("userId", "==", userId));
    const custSnap = await getDocs(custQuery);
    customers = [];
    const select = document.getElementById('custSelect');
    const list = document.getElementById('customerList');
    select.innerHTML = "<option>কাস্টমার সিলেক্ট করুন</option>";
    list.innerHTML = "";
    let totalBaki = 0;

    custSnap.forEach(doc => {
      const c = {id: doc.id, ...doc.data()};
      customers.push(c);
      select.innerHTML += `<option value="${c.id}">${c.name} - ${c.phone}</option>`;
      
      const balanceClass = c.balance > 0 ? 'balance-due' : 'balance-clear';
      list.innerHTML += `
        <div class="customer">
          <div class="customer-info">
            <b>${c.name}</b><br>
            <small>${c.phone}</small>
          </div>
          <div class="customer-balance ${balanceClass}">${c.balance} টাকা</div>
        </div>
      `;
      if(c.balance > 0) totalBaki += c.balance;
    });

    // লেনদেন লোড
    const transQuery = query(collection(db, "transactions"), where("userId", "==", userId));
    const transSnap = await getDocs(transQuery);
    let totalJoma = 0;
    transSnap.forEach(doc => {
      if(doc.data().type === 'joma') totalJoma += doc.data().amount;
    });

    document.getElementById('totalBaki').innerText = totalBaki + " টাকা";
    document.getElementById('totalJoma').innerText = totalJoma + " টাকা";
  }
</script>

</body>
</html>
