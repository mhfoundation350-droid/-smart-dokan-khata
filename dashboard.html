<!DOCTYPE html>
<html>
<head>
  <title>Smart Dokan Khata</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{box-sizing:border-box;}
    body{font-family: 'SolaimanLipi', Arial; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin:0; padding:8px; min-height:100vh;}
    .container{max-width:600px; margin:auto;}
    
    .header{display:flex; align-items:center; background:white; padding:8px 10px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.15); margin-bottom:8px;}
    .header img{width:35px; margin-right:6px;}
    .header h2{margin:0; color:#667eea; font-size:15px; flex:1;}
    .header button{background:#ff4757; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-size:12px;}
    
    .card{background:white; padding:10px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); margin-bottom:8px;}
    .card h3{margin:0 0 8px 0; color:#333; border-bottom:1px solid #667eea; padding-bottom:5px; font-size:14px;}
    
    input, select{width:100%; padding:6px 8px; margin:5px 0; border:1px solid #ccc; border-radius:5px; font-size:13px;}
    input:focus{border-color:#667eea; outline:none;}
    
    .btn-group{display:flex; gap:6px;}
    .btn{flex:1; padding:7px; border:none; border-radius:5px; cursor:pointer; font-size:13px; font-weight:bold;}
    .btn-baki{background:#ff6b6b; color:white;}
    .btn-joma{background:#1dd1a1; color:white;}
    .btn-add{background:#667eea; color:white;}
    .btn-confirm{background:#3742fa; color:white; width:100%; margin-top:6px; font-size:13px;}
    .btn-select{border:2px solid transparent;}
    .btn-select.active{border-color:#333;}
    
    .summary{display:grid; grid-template-columns:1fr 1fr; gap:6px; text-align:center;}
    .summary-box{background:#f1f2f6; padding:8px; border-radius:6px;}
    .summary-box h4{margin:2px 0; color:#666; font-size:11px;}
    .summary-box p{margin:2px 0; font-size:16px; font-weight:bold; color:#667eea;}
    
    .customer-list .customer{display:flex; justify-content:space-between; align-items:center; background:#f1f2f6; padding:6px 8px; border-radius:6px; margin:5px 0; gap:6px;}
    .customer-info b{color:#333; font-size:13px;}
    .customer-info small{color:#666; font-size:11px;}
    .customer-balance{font-weight:bold; font-size:14px;}
    .balance-due{color:#ff4757;} .balance-clear{color:#1dd1a1;}
    
    .icon-group{display:flex; gap:3px;}
    .icon-btn{background:white; padding:5px; border-radius:50%; width:25px; height:25px; display:flex; align-items:center; justify-content:center; border:none; cursor:pointer;}
    .icon-btn svg{width:13px; height:13px;}
    .icon-delete svg{fill:#ff4757;}
    
    .search-box{position:relative; margin-bottom:8px;}
    .search-box input{padding-left:28px; padding-top:6px; padding-bottom:6px;}
    .search-icon{position:absolute; left:8px; top:50%; transform:translateY(-50%); font-size:14px; color:#999;}
    
    .history-item{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #eee; font-size:12px;}
    .history-date{font-size:10px; color:#666;}
    .history-baki{color:#ff4757; font-weight:bold;} 
    .history-joma{color:#1dd1a1; font-weight:bold;}
  </style>
</head>
<body>

<div class="container">
  <div class="header"><img src="logo.png"><h2 id="shopName">আমার দোকান</h2><button onclick="logout()">Logout</button></div>

  <div class="card">
    <h3>নতুন কাস্টমার এড</h3>
    <input type="text" id="custName" placeholder="কাস্টমারের নাম">
    <input type="tel" id="custPhone" placeholder="মোবাইল নাম্বার 01XXXXXXXXX">
    <button class="btn btn-add" onclick="addCustomer()">কাস্টমার এড করুন</button>
  </div>

  <div class="card">
    <h3>নতুন লেনদেন</h3>
    <select id="custSelect"><option>কাস্টমার সিলেক্ট করুন</option></select>
    <input type="number" id="amount" placeholder="টাকার পরিমাণ">
    <div class="btn-group">
      <button id="btnBaki" class="btn btn-baki btn-select" onclick="selectType('baki')">বাকি +</button>
      <button id="btnJoma" class="btn btn-joma btn-select" onclick="selectType('joma')">জমা -</button>
    </div>
    <button class="btn btn-confirm" onclick="confirmTransaction()">✅ কনফার্ম করুন</button>
  </div>

  <div class="card">
    <h3>মোট হিসাব</h3>
    <div class="summary">
      <div class="summary-box"><h4>মোট বাকি</h4><p id="totalBaki">0 টাকা</p></div>
      <div class="summary-box"><h4>মোট জমা</h4><p id="totalJoma">0 টাকা</p></div>
    </div>
  </div>

  <div class="card">
    <h3>সাম্প্রতিক লেনদেন</h3>
    <div id="transactionHistory">কোনো লেনদেন নাই</div>
  </div>

  <div class="card">
    <h3>সকল কাস্টমার</h3>
    <div class="search-box"><span class="search-icon">🔍</span><input type="text" id="searchInput" placeholder="নাম বা নাম্বার দিয়ে সার্চ করুন..." onkeyup="searchCustomer()"></div>
    <div id="customerList" class="customer-list">কোনো কাস্টমার নাই</div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, query, where, doc, setDoc, updateDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp({apiKey: "AIzaSyBdbroawwWdIX6CgQJFFv4Kk3oXAgnc_ak", authDomain: "smart-dokan-khata.firebaseapp.com", projectId: "smart-dokan-khata"});
  const auth = getAuth(app); const db = getFirestore(app);
  let userId = null; let customers = []; let selectedType = null;
  const days = ["রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার"];

  onAuthStateChanged(auth, (user) => { if (user) { userId = user.uid; loadData(); } else { window.location.href = "index.html"; } });
  window.logout = () => signOut(auth);

  window.addCustomer = async () => {
    const name = document.getElementById('custName').value;
    const phone = document.getElementById('custPhone').value;
    if(!name || !phone) return alert("নাম ও নাম্বার দিন");
    await addDoc(collection(db, "customers"), {userId, name, phone, balance: 0});
    document.getElementById('custName').value = ""; document.getElementById('custPhone').value = ""; loadData();
  }

  window.selectType = (type) => {
    selectedType = type;
    document.getElementById('btnBaki').classList.remove('active');
    document.getElementById('btnJoma').classList.remove('active');
    document.getElementById(type==='baki'?'btnBaki':'btnJoma').classList.add('active');
  }

  window.confirmTransaction = async () => {
    const custId = document.getElementById('custSelect').value; 
    const amount = Number(document.getElementById('amount').value);
    if(custId === "কাস্টমার সিলেক্ট করুন" || !amount || !selectedType) return alert("সব তথ্য দিন");

    const now = new Date();
    await addDoc(collection(db, "transactions"), {userId, custId, amount, type: selectedType, date: now});
    
    const custRef = doc(db, "customers", custId); 
    const custSnap = await getDoc(custRef);
    let newBalance = custSnap.data().balance; 
    if(selectedType === 'baki') newBalance += amount; else newBalance -= amount;
    await updateDoc(custRef, {balance: newBalance}); 
    
    document.getElementById('amount').value = ""; selectedType = null;
    document.getElementById('btnBaki').classList.remove('active'); document.getElementById('btnJoma').classList.remove('active'); 
    loadData();
  }

  window.deleteCustomer = async (custId, custName) => {
    if(confirm(`আপনি কি "${custName}" কে ডিলেট করতে চান?`)){
      await deleteDoc(doc(db, "customers", custId)); loadData();
    }
  }

  window.searchCustomer = () => {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const filtered = customers.filter(c => c.name.toLowerCase().includes(searchTerm) || c.phone.includes(searchTerm));
    displayCustomers(filtered);
  }

  function formatDate(timestamp){
    if(!timestamp) return "তারিখ নাই";
    const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
    const date = d.toLocaleDateString('bn-BD');
    const day = days[d.getDay()];
    const time = d.toLocaleTimeString('bn-BD', {hour: '2-digit', minute:'2-digit'});
    return `${date} - ${day} - ${time}`;
  }

  function displayCustomers(custList) {
    const list = document.getElementById('customerList'); list.innerHTML = "";
    if(custList.length === 0){ list.innerHTML = "কোনো কাস্টমার পাওয়া যায়নি"; return; }
    custList.forEach(c => {
      const balanceClass = c.balance > 0 ? 'balance-due' : 'balance-clear';
      let cleanNumber = c.phone.replace(/\D/g, '');
      if(cleanNumber.startsWith('0')) { cleanNumber = '88' + cleanNumber.substring(1); } 
      else if(!cleanNumber.startsWith('88')) { cleanNumber = '88' + cleanNumber; }
      list.innerHTML += `
        <div class="customer">
          <div class="customer-info"><b>${c.name}</b><br><small>${c.phone}</small></div>
          <div style="display:flex; align-items:center; gap:5px;">
            <div class="icon-group">
              <a href="tel:${c.phone}" class="icon-btn"><svg viewBox="0 0 24 24" fill="#4CAF50"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></a>
              <a href="https://wa.me/${cleanNumber}" target="_blank" class="icon-btn"><svg viewBox="0 0 32 32" fill="#25D366"><path d="M16.004 3.626c-7.372 0-13.375 5.996-13.375 13.373 0 2.354.614 4.648 1.781 6.673L3.006 30.47l6.887-1.802a13.37 13.37 0 0 0 6.111 1.555c7.372 0 13.375-5.996 13.375-13.373S23.376 3.626 16.004 3.626zm5.954 16.22c-.262.73-1.514 1.4-2.055 1.49-.517.09-1.172.13-1.89-.12-.434-.148-.99-.342-1.702-.672-3.01-1.433-4.972-4.778-5.12-4.997-.147-.219-1.209-1.605-1.209-3.061s.758-2.165 1.028-2.461c.27-.298.59-.378.788-.378.176 0 .354.01.51.015.164.004.384-.06.6.46.255.646.873 2.247.95 2.408.076.161.127.349.025.556-.101.208-.152.337-.297.516-.147.18-.31.402-.442.54-.147.165-.301.345-.13.675.17.33.756 1.245 1.623 2.015 1.12 1.004 2.06 1.315 2.352 1.462.29.148.46.123.63-.074.17-.196.73-.852.926-1.145.196-.293.39-.246.655-.146.266.101 1.694.799 1.984.945.29.146.484.219.558.34.074.12.074.7-.18 1.43z"/></svg></a>
              <button onclick="deleteCustomer('${c.id}', '${c.name}')" class="icon-btn icon-delete"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
            </div>
            <div class="customer-balance ${balanceClass}">${c.balance} টাকা</div>
          </div>
        </div>
      `;
    });
  }

  async function loadData() { 
    const custSnap = await getDocs(query(collection(db, "customers"), where("userId", "==", userId)));
    customers = []; const select = document.getElementById('custSelect');
    select.innerHTML = "<option>কাস্টমার সিলেক্ট করুন</option>"; 
    let totalBaki = 0;

    custSnap.forEach(doc => {
      const c = {id: doc.id, ...doc.data()}; customers.push(c);
      select.innerHTML += `<option value="${c.id}">${c.name} - ${c.phone}</option>`;
      if(c.balance > 0) totalBaki += c.balance;
    });
    displayCustomers(customers);

    const transSnap = await getDocs(query(collection(db, "transactions"), where("userId", "==", userId)));
    let totalJoma = 0; let historyArray = [];
    
    transSnap.forEach(doc => {
      const t = {id: doc.id, ...doc.data()};
      if(t.type === 'joma') totalJoma += t.amount;
      historyArray.push(t);
    });

    historyArray.sort((a,b) => {
      const dateA = a.date ? (a.date.toDate ? a.date.toDate() : new Date(a.date)) : 0;
      const dateB = b.date ? (b.date.toDate ? b.date.toDate() : new Date(b.date)) : 0;
      return dateB - dateA;
    });

    let historyHTML = "";
    historyArray.forEach(t => {
      const cust = customers.find(c => c.id === t.custId);
      const typeText = t.type === 'baki' ? 'বাকি' : 'জমা';
      const typeClass = t.type === 'baki' ? 'history-baki' : 'history-joma';
      historyHTML += `
        <div class="history-item">
          <div>
            <b>${cust ? cust.name : 'ডিলেট'}</b> - <span class="${typeClass}">${typeText} ${t.amount} টাকা</span><br>
            <span class="history-date">${formatDate(t.date)}</span>
          </div>
        </div>
      `;
    });

    document.getElementById('transactionHistory').innerHTML = historyHTML || "কোনো লেনদেন নাই";
    document.getElementById('totalBaki').innerText = totalBaki + " টাকা";
    document.getElementById('totalJoma').innerText = totalJoma + " টাকা";
  }
</script>
</body>
</html>
